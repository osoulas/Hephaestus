[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hephaestus"
version = "0.1.0"
description = "Self-designing experiment agent for materials discovery: LLM-orchestrated, code-gated, literature-grounded."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Oskar Soulas", email = "ogs353@bham.ac.uk" },
]
keywords = ["materials discovery", "llm agent", "perovskites", "machine-learning potentials"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
# Core: everything the default test suite needs (no GPU, no network).
dependencies = [
  "anthropic>=0.40",
  "ase>=3.23",
  "claude-agent-sdk>=0.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=2.0",
  "mp-api>=0.45",
  "numpy>=1.26",
  "phonopy>=2.26",
  "pydantic>=2.7",
  "pymatgen>=2024.6.10",
  "rich>=13.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Simulation and property models (MACE, MEGNet, phonons). On Windows with CUDA 12.2,
# install torch first: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
sim = [
  "mace-torch>=0.3.10",
  "matgl>=1.1",
  "torch>=2.5",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
hephaestus = "hephaestus.interfaces.cli.app:main"

[project.urls]
Homepage = "https://github.com/osoulas/Hephaestus"
Issues = "https://github.com/osoulas/Hephaestus/issues"
Repository = "https://github.com/osoulas/Hephaestus"

[tool.setuptools.packages.find]
where = ["."]
include = ["hephaestus", "hephaestus.*"]

[tool.setuptools.package-data]
hephaestus = ["py.typed", "interfaces/web/**/*"]

[tool.pytest.ini_options]
# The default suite is offline, CPU-only and needs no API key. A later -m on the
# command line overrides this one: `pytest -m slow`, `pytest -m live`.
addopts = "-ra --strict-config --strict-markers -m 'not slow and not live'"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "slow: real MACE / MEGNet on cached tiny cases (pytest -m slow)",
  "live: real LLM, Valency or Materials Project calls (pytest -m live)",
]

[tool.coverage.run]
branch = true
source = ["hephaestus"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
src = ["."]
target-version = "py311"
extend-exclude = ["summary_change_in_git.py"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["B", "D", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["hephaestus", "tests"]
python_version = "3.11"
pretty = true
show_error_codes = true
ignore_missing_imports = true
warn_unreachable = true
