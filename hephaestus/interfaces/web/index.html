<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hephaestus</title>
    <meta name="description" content="Self-designing experiment agent for materials discovery." />
    <link rel="icon" href="favicon.svg?v=anvil" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Apply the stored theme before first paint, so there is no flash.
      try {
        const t = localStorage.getItem("heph-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
